name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install lint dependencies
        run: npm ci
      - name: Lint frontend and backend
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
      - name: Upload backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/prisma/schema.prisma
            backend/prisma/migrations/
          if-no-files-found: error
      - name: Package compiled backend as a container image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "clubmanager-backend:$GITHUB_SHA" backend
          docker save "clubmanager-backend:$GITHUB_SHA" | gzip > backend-image.tar.gz
      - name: Upload backend image
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish-bootstrap-image:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ci/github-actions'
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: backend-image
      - name: Publish initial Render image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load --input backend-image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clubmanager-backend:bootstrap"
          docker tag "clubmanager-backend:$GITHUB_SHA" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clubmanager
          POSTGRES_PASSWORD: clubmanager
          POSTGRES_DB: clubmanager_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clubmanager -d clubmanager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
      - name: Test backend
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage
      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: error
