name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install lint dependencies
        run: npm ci
      - name: Lint frontend and backend
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build
      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Package frontend and API as one container image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "clubmanager:$GITHUB_SHA" .
          docker save "clubmanager:$GITHUB_SHA" | gzip > clubmanager-image.tar.gz
      - name: Upload application image
        uses: actions/upload-artifact@v7
        with:
          name: clubmanager-image
          path: clubmanager-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clubmanager
          POSTGRES_PASSWORD: clubmanager
          POSTGRES_DB: clubmanager_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clubmanager -d clubmanager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
      - name: Test backend
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage
      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
    environment:
      name: production
      url: ${{ steps.render.outputs.url }}
    permissions:
      packages: write
    steps:
      - name: Download application image
        uses: actions/download-artifact@v7
        with:
          name: clubmanager-image
      - name: Publish verified image to GitHub Container Registry
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load --input clubmanager-image.tar.gz
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:$GITHUB_SHA"
          docker tag "clubmanager:$GITHUB_SHA" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image" | tee "$RUNNER_TEMP/clubmanager-push.log"
          digest=$(awk '$2 == "digest:" {print $3}' "$RUNNER_TEMP/clubmanager-push.log")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not find the published image digest in Docker's push output."
            exit 1
          fi
          reference="$repository@$digest"
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'Published image: %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the published image to Render
        id: render
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || secrets.RENDER_SERVICE_ID }}
        run: |
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" || -z "$RENDER_APP_URL" ]]; then
            echo "::error::Create the Render service from the published image, then set RENDER_API_KEY, RENDER_SERVICE_ID and RENDER_APP_URL in the production environment."
            exit 1
          fi

          endpoint="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          requested_at=$(date -u +%FT%TZ)
          response=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg image "$IMAGE_REFERENCE" '{imageUrl: $image}')" \
            "$endpoint")
          deploy_id=$(jq -r '.id // empty' <<< "$response")

          for attempt in {1..48}; do
            # Render can accept a queued deploy without returning an ID.
            if [[ -z "$deploy_id" ]]; then
              response=$(curl --fail-with-body --silent --show-error --retry 3 --max-time 20 \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                --get --data-urlencode "createdAfter=$requested_at" "$endpoint")
              deploy_id=$(jq -r --arg image "$IMAGE_REFERENCE" \
                'first(.[].deploy | select(.trigger == "api" and .image.ref == $image) | .id) // empty' \
                <<< "$response")
              if [[ -z "$deploy_id" ]]; then
                sleep 10
                continue
              fi
            fi

            response=$(curl --fail-with-body --silent --show-error --retry 3 --max-time 20 \
              --header "Authorization: Bearer $RENDER_API_KEY" "$endpoint/$deploy_id")
            status=$(jq -er '.status' <<< "$response")
            case "$status" in
              live)
                curl --fail --silent --show-error --retry 3 --max-time 30 \
                  "${RENDER_APP_URL%/}/api/health" | jq -e '.status == "ok"'
                printf 'url=%s\n' "$RENDER_APP_URL" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress) sleep 10 ;;
              *) echo "::error::Render deploy $deploy_id ended with status $status"; exit 1 ;;
            esac
          done

          echo "::error::Timed out waiting for Render to deploy $IMAGE_REFERENCE."
          exit 1
